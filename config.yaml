# Default deployment is loopback-only, SQLite and local models.
ollama_url: http://127.0.0.1:11434
lmstudio_url: http://127.0.0.1:1234/v1
auto_sync: true
workers: 2
queue_capacity: 16
chunk_size: 900
chunk_overlap: 120
embeddings:
  provider: ollama
  model: nomic-embed-text
  dimension: 384 # hash fallback dimension; Ollama dimension is discovered
  allow_initial_hash_fallback: true # only when creating an index, never mid-index
  batch_size: 32
retrieval:
  contextual_chunking:
    enabled: true
    mode: structure # use llm for optional expensive contextual descriptions
    model: qwen3:4b
  dense_k: 50
  sparse_k: 50
  candidate_k: 100
  rerank_k: 20
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 1.0
  parent_expansion: true
  parent_max_chars: 2400
  max_context_chars: 10000
reranker:
  provider: heuristic # cross_encoder requires optional local weights + dependency
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  model_path: null
  device: cpu
query:
  expansion:
    enabled: false
    num_queries: 3
    min_query_words: 6
  hyde: false
  provider: ollama
  model: qwen3:4b
  allow_extractive_fallback: true
  max_tokens: 1024
security:
  auth_mode: local # token for tenant/owner isolation; see docs/API.md
  credentials_file: null
  max_upload_bytes: 20971520
  block_suspicious_evidence: true
evidence:
  min_query_coverage: 0.25
  min_dense_score: 0.2
  min_claim_support: 0.8
